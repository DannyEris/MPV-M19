apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86":3, "x86_64":4]
ext.universalBase = 8000

android {
    namespace 'is.xyz.mpv'
    compileSdk 35
    defaultConfig {
        minSdkVersion 21
        targetSdk 35
        versionCode 44
        versionName "2025-12-27-release"
        vectorDrawables.useSupportLibrary = true
    }
    flavorDimensions "default"
    productFlavors {
        "default" {
            isDefault true
        }
        api29 {
            targetSdkVersion 29
            versionNameSuffix "-oldapi"
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    // 关键修复：直接将 jniLibs 指向 ndk-build 输出的真实物理目录，规避软链接引发的 NPE
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/libs']
        }
    }
    splits {
        abi {
            enable true
            reset()
            // 包含实际已编译出的 ABI
            project.ext.abiCodes.each { abi, _ ->
                if (new File(project.projectDir, "src/main/libs/${abi}").exists() ||
                    new File(project.projectDir, "src/main/jniLibs/${abi}").exists())
                    include(abi)
            }
            universalApk true // 生成全架构包含的通用 APK
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
        kotlinOptions.jvmTarget = JavaVersion.VERSION_11.toString()
    }
}

// 映射版本号
import com.android.build.VariantOutput
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def base = project.ext.abiCodes.get(output.getFilter(VariantOutput.ABI))
        if (base != null)
            output.versionCodeOverride = base * 1000 + variant.versionCode
        else
            output.versionCodeOverride = universalBase + variant.versionCode
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media:media:1.7.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.material:material:1.13.0'
}
