name: Build mpv-android for TVBox

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '选择构建架构 (针对天猫魔盒M19请保持默认32位)'
        required: true
        default: '32位 (armeabi-v7a，天猫魔盒M19专用)'
        type: choice
        options:
          - '32位 (armeabi-v7a，天猫魔盒M19专用)'
          - 'universal (通用单APK，含32/64位)'
          - 'all (生成所有版本)'
          - '64位 (arm64-v8a，其他纯64位盒子)'

jobs:
  build:
    name: Build Native & APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 通过 pip3 安装最新 Meson (>=1.3.0) 与 Ninja
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build unzip wget nasm yasm apksigner python3-pip python3-setuptools
          sudo pip3 install --upgrade meson ninja
          meson --version

      - name: Grant Execute Permissions
        run: |
          chmod -R +x buildscripts
          chmod +x gradlew

      # 链接 Runner 原生 Android SDK 路径
      - name: Prepare Environment & Link SDK
        run: |
          mkdir -p buildscripts/sdk
          ln -sf "$ANDROID_HOME" buildscripts/sdk/android-sdk-linux

      # 下载必要依赖，限制刷屏输出并重试
      - name: Download SDK, NDK and Native Dependencies
        working-directory: buildscripts
        env:
          IN_CI: 1
          WGET: wget -q --show-progress --progress=dot:giga --tries=5 -c
        run: |
          ./download.sh

      # 按需编译底层 C/C++ 库
      - name: Build Native Libraries
        working-directory: buildscripts
        run: |
          CHOICE="${{ github.event.inputs.target_arch }}"
          echo "Selected Choice: $CHOICE"
          
          if [[ "$CHOICE" == *"32位"* ]]; then
            echo ">> 针对天猫魔盒 M19：仅编译 32 位 (armv7l)，大幅加速编译速度..."
            ./buildall.sh --arch armv7l mpv
          elif [[ "$CHOICE" == *"64位"* ]]; then
            echo ">> 仅编译 64 位 (arm64)..."
            ./buildall.sh --arch arm64 mpv
          else
            echo ">> 编译 32 位与 64 位双架构底层..."
            ./buildall.sh --arch armv7l mpv
            ./buildall.sh --arch arm64 mpv
          fi
          
          # 清理软链接防冲突
          rm -rf ../app/src/main/jniLibs
          
          # 编译 JNI 胶水库
          NO_GRADLE=1 ./buildall.sh -n

      # 构建 Android Release APK
      - name: Build Android APK via Gradle
        run: |
          rm -rf app/src/main/jniLibs
          ./gradlew assembleDefaultRelease --stacktrace

      # 签名并按选择过滤输出文件
      - name: Sign & Filter Release APKs
        run: |
          keytool -genkey -v -keystore release.jks -alias tvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=mpv, OU=tv, O=tv, L=SH, S=SH, C=CN"
          mkdir -p output_apks
          
          CHOICE="${{ github.event.inputs.target_arch }}"
          echo "Filtering and signing for: $CHOICE"
          
          for apk in app/build/outputs/apk/default/release/*-unsigned.apk; do
            if [ -f "$apk" ]; then
              fname=$(basename "$apk")
              
              if [[ "$CHOICE" == *"32位"* ]] && [[ "$fname" != *"armeabi-v7a"* ]]; then
                continue
              fi
              if [[ "$CHOICE" == *"64位"* ]] && [[ "$fname" != *"arm64-v8a"* ]]; then
                continue
              fi
              if [[ "$CHOICE" == *"universal"* ]] && [[ "$fname" != *"universal"* ]]; then
                continue
              fi
              
              out_apk="output_apks/${fname/-unsigned.apk/-signed.apk}"
              apksigner sign --ks release.jks --ks-pass pass:123456 --ks-key-alias tvbox --key-pass pass:123456 --out "$out_apk" "$apk"
              echo "Signed Package Output: $out_apk"
            fi
          done
          
          ls -lh output_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpv-tvbox-release
          path: output_apks/*.apk
