name: Build mpv-android for TVBox

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '选择构建架构 (天猫魔盒M19请保持默认32位)'
        required: true
        default: '32位 (armeabi-v7a，天猫魔盒M19专用)'
        type: choice
        options:
          - '32位 (armeabi-v7a，天猫魔盒M19专用)'
          - 'universal (通用单APK，含32/64位)'
          - 'all (生成所有版本)'
          - '64位 (arm64-v8a，其他纯64位盒子)'

jobs:
  build:
    name: Build Native & APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build unzip wget nasm yasm apksigner python3-pip python3-setuptools
          sudo pip3 install --upgrade meson ninja
          meson --version

      - name: Grant Execute Permissions and Fix Line Endings
        run: |
          sed -i 's/\r$//' buildscripts/*.sh buildscripts/scripts/*.sh gradlew || true
          chmod -R +x buildscripts
          chmod +x gradlew

      # 关键自愈步骤：自动恢复原版完整 strings.xml 并智能合并 TVBox 定制词条，彻底根除 AAPT 缺失报错
      - name: Auto Heal & Merge String Resources
        run: |
          STRINGS_FILE="app/src/main/res/values/strings.xml"
          if ! grep -q 'name="mpv_activity"' "$STRINGS_FILE"; then
            echo ">> 检测到基础词条被覆盖，正在从 Git 历史恢复完整原版 strings.xml..."
            ORIG_COMMIT=$(git log --reverse --format="%H" -- "$STRINGS_FILE" | head -n 1)
            git show "$ORIG_COMMIT:$STRINGS_FILE" > "$STRINGS_FILE"
          fi

          python3 - << 'EOF'
          import xml.etree.ElementTree as ET

          path = "app/src/main/res/values/strings.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          custom_strings = {
              "error_no_file": "未获取到有效的播放地址",
              "btn_play": "播放",
              "btn_pause": "暂停",
              "btn_skip_intro": "设片头",
              "btn_skip_outro": "设片尾",
              "toast_intro_set": "已记录片头跳过点：%s (长按清除)",
              "toast_intro_reset": "已清除片头跳过设置",
              "toast_outro_set": "已记录片尾跳过点：%s (长按清除)",
              "toast_outro_reset": "已清除片尾跳过设置",
              "toast_intro_skipped": "已自动跳过片头",
              "hdr_to_sdr": "HDR映射",
              "hdr_auto": "自动",
              "hdr_on": "开启(SDR)",
              "hdr_off": "关闭",
              "aspect_default": "默认比例",
              "aspect_16_9": "16:9",
              "aspect_4_3": "4:3",
              "aspect_fill": "拉伸全屏",
              "aspect_original": "原始画面",
              "aspect_crop": "裁剪填充",
              "btn_subtitle_settings": "字幕",
              "btn_audio_track": "音轨",
              "btn_video_track": "视轨",
              "track_off": "关闭",
              "track_subs": "选择字幕轨道",
              "sub_font_size": "字幕字体缩放",
              "sub_vertical_position": "字幕垂直位置",
              "sub_delay": "字幕时间轴微调",
              "title_speed_dialog": "播放倍速调节"
          }

          existing_names = {elem.attrib.get("name") for elem in root.findall("string")}
          added = 0
          for name, val in custom_strings.items():
              if name not in existing_names:
                  elem = ET.SubElement(root, "string", {"name": name})
                  elem.text = val
                  added += 1

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print(f">> 成功确保 {added} 项 TVBox 定制词条合并入库。")
          EOF

      - name: Prepare Environment & Link SDK
        run: |
          mkdir -p buildscripts/sdk
          ln -sf "$ANDROID_HOME" buildscripts/sdk/android-sdk-linux

      - name: Download SDK, NDK and Native Dependencies
        working-directory: buildscripts
        env:
          IN_CI: 1
          WGET: wget -q --show-progress --progress=dot:giga --tries=5 -c
        run: |
          ./download.sh

      - name: Build Native Libraries
        working-directory: buildscripts
        run: |
          CHOICE="${{ github.event.inputs.target_arch }}"
          echo "Selected Choice: $CHOICE"
          
          if [[ "$CHOICE" == *"32位"* ]]; then
            echo ">> 针对天猫魔盒 M19：仅编译 32 位 (armv7l)..."
            ./buildall.sh --arch armv7l mpv
          elif [[ "$CHOICE" == *"64位"* ]]; then
            echo ">> 仅编译 64 位 (arm64)..."
            ./buildall.sh --arch arm64 mpv
          else
            echo ">> 编译 32 位与 64 位双架构底层..."
            ./buildall.sh --arch armv7l mpv
            ./buildall.sh --arch arm64 mpv
          fi
          
          rm -rf ../app/src/main/jniLibs
          NO_GRADLE=1 ./buildall.sh -n

      - name: Build Android APK via Gradle
        run: |
          rm -rf app/src/main/jniLibs
          ./gradlew assembleDefaultRelease --stacktrace

      - name: Sign & Filter Release APKs
        run: |
          keytool -genkey -v -keystore release.jks -alias tvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=mpv, OU=tv, O=tv, L=SH, S=SH, C=CN"
          mkdir -p output_apks
          
          CHOICE="${{ github.event.inputs.target_arch }}"
          echo "Filtering and signing for: $CHOICE"
          
          for apk in app/build/outputs/apk/default/release/*-unsigned.apk; do
            if [ -f "$apk" ]; then
              fname=$(basename "$apk")
              
              if [[ "$CHOICE" == *"32位"* ]] && [[ "$fname" != *"armeabi-v7a"* ]]; then
                continue
              fi
              if [[ "$CHOICE" == *"64位"* ]] && [[ "$fname" != *"arm64-v8a"* ]]; then
                continue
              fi
              if [[ "$CHOICE" == *"universal"* ]] && [[ "$fname" != *"universal"* ]]; then
                continue
              fi
              
              out_apk="output_apks/${fname/-unsigned.apk/-signed.apk}"
              apksigner sign --ks release.jks --ks-pass pass:123456 --ks-key-alias tvbox --key-pass pass:123456 --out "$out_apk" "$apk"
              echo "Signed Package Output: $out_apk"
            fi
          done
          
          ls -lh output_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpv-tvbox-release
          path: output_apks/*.apk
