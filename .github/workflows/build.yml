name: Build mpv-android for TVBox

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '请选择生成的架构类型 (Select architecture)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'universal'
          - 'arm64-v8a'
          - 'armeabi-v7a'

jobs:
  build:
    name: Build Native & APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 使用 pip3 升级安装最新 Meson 与 Ninja，彻底解决 libplacebo 要求 Meson>=1.3.0 的报错
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build unzip wget nasm yasm apksigner python3-pip python3-setuptools
          sudo pip3 install --upgrade meson ninja
          meson --version

      - name: Grant Execute Permissions
        run: |
          chmod -R +x buildscripts
          chmod +x gradlew

      # 链接宿主机 Android SDK，避免重复下载
      - name: Prepare Environment & Link SDK
        run: |
          mkdir -p buildscripts/sdk
          ln -sf "$ANDROID_HOME" buildscripts/sdk/android-sdk-linux

      # 下载依赖，限制刷屏日志并增加自动重试
      - name: Download SDK, NDK and Native Dependencies
        working-directory: buildscripts
        env:
          IN_CI: 1
          WGET: wget -q --show-progress --progress=dot:giga --tries=5 -c
        run: |
          ./download.sh

      # 根据 workflow 输入选项按需编译对应架构，减少无效等待
      - name: Build Native Libraries
        working-directory: buildscripts
        run: |
          TARGET="${{ github.event.inputs.target_arch || 'all' }}"
          echo "Current Target Architecture: $TARGET"
          
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "universal" ]; then
            echo "Building both arm64 and armv7l..."
            ./buildall.sh --arch arm64 mpv
            ./buildall.sh --arch armv7l mpv
          elif [ "$TARGET" = "arm64-v8a" ]; then
            echo "Building arm64 only..."
            ./buildall.sh --arch arm64 mpv
          elif [ "$TARGET" = "armeabi-v7a" ]; then
            echo "Building armv7l (32-bit) only..."
            ./buildall.sh --arch armv7l mpv
          fi
          
          # 编译 JNI 胶水层 (通过 DONT_BUILD_RELEASE 避免重复冗余编译)
          export DONT_BUILD_RELEASE=1
          ./buildall.sh -n

      # 构建 Android Release APK
      - name: Build Android APK via Gradle
        run: |
          ./gradlew assembleDefaultRelease --stacktrace

      # 证书签名与输出过滤
      - name: Sign & Filter Release APKs
        run: |
          keytool -genkey -v -keystore release.jks -alias tvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=mpv, OU=tv, O=tv, L=SH, S=SH, C=CN"
          mkdir -p output_apks
          
          TARGET="${{ github.event.inputs.target_arch || 'all' }}"
          echo "Filtering and signing for: $TARGET"
          
          for apk in app/build/outputs/apk/default/release/*-unsigned.apk; do
            if [ -f "$apk" ]; then
              fname=$(basename "$apk")
              
              # 按目标选项过滤
              if [ "$TARGET" = "arm64-v8a" ] && [[ "$fname" != *"arm64-v8a"* ]]; then
                continue
              fi
              if [ "$TARGET" = "armeabi-v7a" ] && [[ "$fname" != *"armeabi-v7a"* ]]; then
                continue
              fi
              if [ "$TARGET" = "universal" ] && [[ "$fname" != *"universal"* ]]; then
                continue
              fi
              
              out_apk="output_apks/${fname/-unsigned.apk/-signed.apk}"
              apksigner sign --ks release.jks --ks-pass pass:123456 --ks-key-alias tvbox --key-pass pass:123456 --out "$out_apk" "$apk"
              echo "Output signed APK: $out_apk"
            fi
          done
          
          ls -lh output_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpv-tvbox-${{ github.event.inputs.target_arch || 'all' }}
          path: output_apks/*.apk
